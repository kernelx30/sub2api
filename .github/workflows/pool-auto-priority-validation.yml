name: Pool auto-priority validation

on:
  push:
    branches:
      - codex/pool-auto-priority-20260729

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Format changed Go files
        run: |
          gofmt -w \
            backend/internal/repository/account_repo.go \
            backend/internal/repository/account_repo_upstream_billing_probe_due_test.go \
            backend/internal/service/gateway_scheduling.go \
            backend/internal/service/scheduler_layered_filter_test.go \
            backend/internal/service/upstream_billing_probe.go \
            backend/internal/service/upstream_billing_probe_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/internal/repository/account_repo.go \
            backend/internal/repository/account_repo_upstream_billing_probe_due_test.go \
            backend/internal/service/gateway_scheduling.go \
            backend/internal/service/scheduler_layered_filter_test.go \
            backend/internal/service/upstream_billing_probe.go \
            backend/internal/service/upstream_billing_probe_test.go
          git commit -m "style: gofmt pool auto-priority changes"
          git push
      - name: Service unit tests
        working-directory: backend
        run: |
          go test -tags unit ./internal/service -run 'Test(FilterByBestProbeAutoPriority|UpstreamBillingProbeEnabledDefaultsToPoolMode|SelectUpstreamHealthProbeModelPrefersGPT56|NextProbeFailureDelayAdaptiveBackoff|ProbePoolModeRecordsModelHealthAndLatency)$'
      - name: Repository query unit test
        working-directory: backend
        run: |
          go test ./internal/repository -run '^TestAccountRepositoryListDueUpstreamBillingProbeAccountsBoundsQuery$'
